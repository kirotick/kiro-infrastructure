# Render "Blueprint": creates the KIRO API server from this repository.
# The database is Neon (project "kiro", branch "production"), not a Render database.
# NOT tested by me (it needs your Render account). Check Render's current plans before you deploy:
#  - free web services go to sleep when idle, so the 10 PM WhatsApp report can be missed;
#    for a real shop choose a paid plan.
# Tests never use the production branch: they use the Neon branch "qa" (qa/.env, TEST_DATABASE_URL).
services:
  - type: web
    name: kiro-api
    runtime: node
    plan: free              # change to a paid plan so it never sleeps
    rootDir: server/node
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # you paste it: Neon console > project kiro > branch production > Connect (pooled, sslmode=verify-full)
      - key: PG_POOL_MAX
        value: "20"             # measured: 100 users, reads p95 3.0 s with 10 connections, 1.3 s with 20 (qa/load)
      - key: JWT_SECRET
        generateValue: true     # Render makes a long random value for you
      - key: PHONEPE_KEK
        sync: false             # you enter it: openssl rand -base64 32
      - key: PHONEPE_BASE_URL
        sync: false             # from PhonePe's documentation for your account
      - key: PUBLIC_BASE_URL
        sync: false             # your API address, e.g. https://kiro-api.onrender.com (no slash at the end)
      - key: CORS_ORIGINS
        sync: false             # your admin website address(es), comma separated; may stay empty
      - key: AI_API_KEY
        sync: false             # optional
      - key: AI_MODEL
        sync: false             # optional
      - key: WA_TOKEN
        sync: false             # optional (nightly WhatsApp report)
      - key: WA_PHONE_NUMBER_ID
        sync: false             # optional
      - key: WA_TEMPLATE
        sync: false             # optional
