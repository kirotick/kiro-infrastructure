# Render "Blueprint" for the KIRO server side. Create it in Render from THIS repository (kiro-infrastructure).
# Database: Neon project "kiro", branch "production" (not a Render database). Tests never use production.
# NOT deployed yet; free web services sleep when idle, so choose a paid plan for real shops.
services:
  - type: web
    name: kiro-api
    runtime: node
    plan: free              # change to a paid plan so it never sleeps
    repo: https://github.com/kirotick/kiro-backend
    branch: main
    rootDir: api
    # Fetch the schema at the version this API is tested with, then install.
    buildCommand: git clone --depth 1 --branch "$(cat database-version.txt)" https://github.com/kirotick/kiro-database ../../kiro-database && npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: KIRO_DATABASE_DIR
        value: ../../kiro-database
      - key: DATABASE_URL
        sync: false             # Neon console > kiro > production > Connect (pooled, sslmode=verify-full)
      - key: JWT_SECRET
        sync: false             # same value as kiro-payments; generate once: openssl rand -base64 48
      - key: CORS_ORIGINS
        sync: false
      - key: AI_API_KEY
        sync: false             # optional
      - key: AI_MODEL
        sync: false             # optional
      - key: WA_TOKEN
        sync: false             # optional (nightly WhatsApp report)
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_TEMPLATE
        sync: false

  - type: web
    name: kiro-pay
    runtime: node
    plan: free
    repo: https://github.com/kirotick/kiro-payments
    branch: main
    rootDir: service/node
    buildCommand: git clone --depth 1 --branch "$(cat database-version.txt)" https://github.com/kirotick/kiro-database ../../../kiro-database && npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: KIRO_DATABASE_DIR
        value: ../../../kiro-database
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false             # must equal kiro-api's JWT_SECRET (tokens are issued there)
      # PAYMENTS_ENABLED is deliberately absent: payments stay disabled until approved (ADR-0004).
      # When approved, also set PHONEPE_KEK, PHONEPE_BASE_URL, PUBLIC_BASE_URL.
